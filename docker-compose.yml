version: '3.8'

services:
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: blogapp-frontend
  #   ports:
  #     - '3001:3000'

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_blogapp
    ports:
      - '3000:3000'
    depends_on:
      - mongodb

  mongodb:
    image: mongo
    container_name: mongo_blogapp
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
